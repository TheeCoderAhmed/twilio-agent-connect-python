name: UV Download Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/uv-download-test.yml"

permissions:
  id-token: write
  contents: read

jobs:
  uv-pip-install:
    name: uv pip install certifi==2026.10.19
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}
    steps:
      - name: Authenticate with Artifactory
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@26f95a54e57993c1bf3b26bec2905f395814c23a # v1.0.0
        with:
          ecosystem: python

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          version: "0.9.26"

      - name: Create virtual environment
        run: uv venv --python 3.12 .venv

      - name: Install certifi==2026.10.19
        run: |
          uv pip install --python .venv/bin/python --no-cache -v certifi==2026.10.19 2>&1 | tee install.log

      - name: Verify download came from Artifactory
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: grep -q "twilio.jfrog.io" install.log

      - name: Verify installed version
        run: |
          installed="$(.venv/bin/python -c 'from importlib.metadata import version; print(version("certifi"))')"
          echo "Installed certifi version: ${installed}"
          test "${installed}" = "2026.10.19"
          .venv/bin/python -c "import certifi; print(certifi.where())"
