name: Test Certifi Download

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-certifi:
    name: Test uv download with certifi 2026.10.19
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Verify uv can download certifi 2026.10.19
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install certifi==2026.10.19
          python -c "import certifi; print(f'Successfully installed certifi version {certifi.__version__}')"
